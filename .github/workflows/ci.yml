name: ci.yaml
on:
  push:
  pull_request:
jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu
            os: ubuntu-latest
            cmake_flags: -DCMAKE_BUILD_TYPE=Release
          - name: ubuntu-sanitizers
            os: ubuntu-latest
            cmake_flags: -DCMAKE_BUILD_TYPE=Debug -DDEMUXUSB_SANITIZE=ON
          - name: macos
            os: macos-latest
            cmake_flags: -DCMAKE_BUILD_TYPE=Release
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libplist-dev libboost-container-dev libboost-filesystem-dev libboost-iostreams-dev libboost-test-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install pkg-config boost libplist

      - name: Configure CMake
        run: cmake -B build ${{ matrix.cmake_flags }}

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure
